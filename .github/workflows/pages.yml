# Publishes the site to GitHub Pages (spec row 1). It runs check.py first, so wrong numbers or a privacy hit never
# reach the public page.
name: pages
on:
  push:
    branches: [live]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live            # when called from update.yml, take the commit it just pushed
      - run: python3 -I scripts/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
